name: Android CI

on:
  push:
  pull_request:
    paths-ignore:
      - 'src/**'
      - 'ios/**'
      - '__tests__/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Install npm dependencies
        run: yarn install
      - name: Build with Gradle
        run: cd android && ./gradlew assembleRelease
      - run: echo "::set-env name=GIT_SHORT_HASH::$(git rev-parse --short $GITHUB_SHA)"
      - run: echo $GIT_SHORT_HASH
      - name: Upload Artifacts
        uses: actions/upload-artifact@v2
        with:
          name: orangehrm-arm64-v8a-release
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v2
        with:
          name: orangehrm-armeabi-v7a-release
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v2
        with:
          name: orangehrm-x86_64-release
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
      - uses: actions/upload-artifact@v2
        with:
          name: orangehrm-x86-release
          path: android/app/build/outputs/apk/release/app-x86-release.apk
      - uses: actions/upload-artifact@v2
        with:
          name: orangehrm-universal-release
          path: android/app/build/outputs/apk/release/app-universal-release.apk
